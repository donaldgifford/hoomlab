# The MD5 session password Cilium presents to the router. Prefer
# creating it without this manifest so no value ever nears git:
#
#   kubectl create secret generic bgp-auth -n kube-system \
#     --from-literal=password="$(op read 'op://homelab/<item>/password')"
#
# The router's `neighbor HOMELAB password` reads the SAME 1Password
# item — one source, two ends, no drift. If you apply this file
# instead, fill the placeholder locally and never commit it.
#
# Two constraints from Cilium's side: the key must be named exactly
# `password`, and the Secret must live in the agent's BGP secrets
# namespace — kube-system, the chart default our cilium-values.yaml
# leaves in place (bgpControlPlane.enabled grants the read RBAC).
---
apiVersion: v1
kind: Secret
metadata:
  name: bgp-auth
  namespace: kube-system
type: Opaque
stringData:
  password: REPLACE-WITH-BGP-MD5-PASSWORD
