! Router-side half of the first BGP peering (runbook §14) — the
! working UCG config, uploaded via UniFi Network → Routing → BGP.
! The cluster-side half is the CiliumBGP* manifests beside this file;
! the two are one change set (DESIGN-0002 T2→T3 contract).
!
! What must agree with the cluster side:
!   remote-as 65200        = CiliumBGPClusterConfig localASN
!   router bgp 65100       = CiliumBGPClusterConfig peers[].peerASN
!   bgp router-id 10.10.11.1 = peers[].peerAddress
!   neighbor password      = the kube-system/bgp-auth Secret — both
!                            ends read the same 1Password item
!   HOMELAB-IN prefix-list = the CiliumLoadBalancerIPPool CIDR
!
! `bgp listen range` means the router never enumerates nodes: any
! peer dialing from 10.10.11.0/24 with the right password and ASN is
! accepted, so nodes re-image and scale with no router edit.
!
! -*- bgp -*-
router bgp 65100
  ! Router ID
  bgp router-id 10.10.11.1

  ! Require explicit policy for eBGP neighbors
  bgp ebgp-requires-policy

  ! Relax autonomous system path matching for multipath routing
  bgp bestpath as-path multipath-relax
  maximum-paths 3

  ! Create peer-group HOMELAB with remote ASN 65200
  neighbor HOMELAB peer-group
  neighbor HOMELAB remote-as 65200
  neighbor HOMELAB password REPLACE-WITH-BGP-MD5-PASSWORD

  ! Peer with any cluster node inside the peering ranges
  bgp listen range 10.10.11.0/24 peer-group HOMELAB

  ! Apply policies
  address-family ipv4 unicast
    redistribute connected
    neighbor HOMELAB activate
    neighbor HOMELAB next-hop-self
    neighbor HOMELAB soft-reconfiguration inbound
    neighbor HOMELAB route-map RM-HOMELAB-IN in
    neighbor HOMELAB route-map RM-HOMELAB-OUT out
  exit-address-family
exit

! VIPs within the service IP pool
ip prefix-list HOMELAB-IN seq 10 permit 172.20.10.0/24 le 32

! Accept Service IPs from cluster peers
route-map RM-HOMELAB-IN permit 10
  match ip address prefix-list HOMELAB-IN
exit

! Router client network
ip prefix-list HOMELAB-OUT seq 10 permit 10.10.11.0/24

! Broadcast client network for cluster peers
route-map RM-HOMELAB-OUT permit 10
  match ip address prefix-list HOMELAB-OUT
exit
