---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Changelog Drift Check
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true
      - name: Generate fresh CHANGELOG
        run: |
          git fetch --tags --force origin
          git-cliff -o CHANGELOG.generated.md
      - name: Diff against committed CHANGELOG
        run: |-
          if ! diff -q CHANGELOG.md CHANGELOG.generated.md > /dev/null; then
            echo "::error::CHANGELOG.md is stale. Run 'git-cliff -o CHANGELOG.md' and commit."
            diff CHANGELOG.md CHANGELOG.generated.md || true
            exit 1
          fi
